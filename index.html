<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaSpark - 3D分子可视化平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a1a;
            color: #fff;
            min-height: 100vh;
        }
        
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 20px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 600;
            color: #00d4ff;
        }
        
        .header p {
            margin-top: 8px;
            color: #888;
            font-size: 14px;
        }
        
        .auth-buttons {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: #00d4ff;
            color: #000;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        
        .btn:hover {
            background: #00b8d4;
        }
        
        .btn-secondary {
            background: #333;
            color: #fff;
        }
        
        .btn-secondary:hover {
            background: #444;
        }
        
        .container {
            display: flex;
            height: calc(100vh - 80px);
        }
        
        .sidebar {
            width: 300px;
            background: #111;
            border-right: 1px solid #333;
            padding: 20px;
            overflow-y: auto;
        }
        
        .sidebar h3 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #00d4ff;
        }
        
        .control-group {
            margin-bottom: 20px;
        }
        
        .control-group label {
            display: block;
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
        }
        
        .control-group select,
        .control-group input {
            width: 100%;
            padding: 8px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .viewer {
            flex: 1;
            position: relative;
            background: #1a1a2e;
        }
        
        #viewer-container {
            width: 100%;
            height: 100%;
        }
        
        .status-bar {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            padding: 10px 15px;
            border-radius: 4px;
            font-size: 12px;
            color: #888;
        }
        
        .info-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 4px;
            font-size: 12px;
            color: #888;
            max-width: 250px;
        }
        
        .info-panel h4 {
            color: #00d4ff;
            margin-bottom: 10px;
        }
        
        .sample-list {
            margin-top: 15px;
        }
        
        .sample-item {
            padding: 10px;
            background: #222;
            border-radius: 4px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .sample-item:hover {
            background: #333;
        }
        
        .sample-item h4 {
            font-size: 14px;
            color: #fff;
            margin-bottom: 5px;
        }
        
        .sample-item p {
            font-size: 12px;
            color: #888;
        }
        
        .loading {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            border: 3px solid #333;
            border-top: 3px solid #00d4ff;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Auth Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
        }
        
        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1a1a2e;
            padding: 30px;
            border-radius: 8px;
            width: 400px;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .modal-header h2 {
            color: #00d4ff;
        }
        
        .close-btn {
            background: none;
            border: none;
            color: #888;
            font-size: 24px;
            cursor: pointer;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            font-size: 14px;
            color: #888;
            margin-bottom: 5px;
        }
        
        .form-group input {
            width: 100%;
            padding: 10px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #00d4ff;
        }
        
        .error-message {
            color: #ff4444;
            font-size: 12px;
            margin-top: 5px;
        }
        
        .user-info {
            display: none;
            align-items: center;
            gap: 10px;
        }
        
        .user-info.show {
            display: flex;
        }
        
        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #00d4ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000;
        }
        
        .user-name {
            font-size: 14px;
            color: #fff;
        }
        
        .logout-btn {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 12px;
        }
        
        .logout-btn:hover {
            color: #ff4444;
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>PharmaSpark</h1>
            <p>3D Gaussian Splatting for Pharmaceutical & Biomedical Visualization</p>
        </div>
        <div class="auth-buttons" id="auth-buttons">
            <button class="btn btn-secondary" onclick="showLogin()">登录</button>
            <button class="btn" onclick="showRegister()">注册</button>
        </div>
        <div class="user-info" id="user-info">
            <div class="user-avatar" id="user-avatar">U</div>
            <span class="user-name" id="user-name">User</span>
            <button class="logout-btn" onclick="logout()">退出</button>
        </div>
    </div>
    
    <div class="container">
        <div class="sidebar">
            <h3>控制面板</h3>
            
            <div class="control-group">
                <label>颜色模式</label>
                <select id="color-mode">
                    <option value="element">按元素</option>
                    <option value="chain">按链</option>
                    <option value="secondary">二级结构</option>
                    <option value="b-factor">B因子</option>
                    <option value="hydrophobicity">疏水性</option>
                </select>
            </div>
            
            <div class="control-group">
                <label>半径缩放</label>
                <input type="range" id="radius-scale" min="0.1" max="2" step="0.1" value="0.5">
            </div>
            
            <div class="control-group">
                <label>透明度</label>
                <input type="range" id="opacity" min="0.1" max="1" step="0.1" value="0.9">
            </div>
            
            <div class="control-group">
                <label>显示氢原子</label>
                <select id="show-hydrogens">
                    <option value="false">否</option>
                    <option value="true">是</option>
                </select>
            </div>
            
            <button class="btn" id="load-sample">加载示例</button>
            <button class="btn btn-secondary" id="clear">清除</button>
            <button class="btn" id="save-molecule" style="display:none;">保存分子</button>
            
            <div class="sample-list">
                <h3>示例分子</h3>
                
                <div class="sample-item" data-pdb="1crn">
                    <h4>1CRN - 蠕虫素</h4>
                    <p>小蛋白质，46个残基</p>
                </div>
                
                <div class="sample-item" data-pdb="4hhb">
                    <h4>4HHB - 血红蛋白</h4>
                    <p>氧气运输蛋白，4个亚基</p>
                </div>
                
                <div class="sample-item" data-pdb="1ubq">
                    <h4>1UBQ - 泛素</h4>
                    <p>小调节蛋白，76个残基</p>
                </div>
                
                <div class="sample-item" data-sdf="aspirin">
                    <h4>阿司匹林</h4>
                    <p>乙酰水杨酸，C9H8O4</p>
                </div>
                
                <div class="sample-item" data-sdf="caffeine">
                    <h4>咖啡因</h4>
                    <p>C8H10N4O2</p>
                </div>
            </div>
        </div>
        
        <div class="viewer">
            <div id="viewer-container"></div>
            
            <div class="status-bar">
                <span id="status">就绪</span>
                <span id="atom-count"></span>
            </div>
            
            <div class="info-panel">
                <h4>分子信息</h4>
                <p id="info-name">未加载分子</p>
                <p id="info-atoms"></p>
                <p id="info-residues"></p>
                <p id="info-chains"></p>
            </div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div>加载中...</div>
            </div>
        </div>
    </div>

    <!-- Login Modal -->
    <div class="modal" id="login-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>登录</h2>
                <button class="close-btn" onclick="closeModals()">&times;</button>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="login-password" required>
                </div>
                <div class="error-message" id="login-error"></div>
                <button type="submit" class="btn" style="width:100%;">登录</button>
            </form>
        </div>
    </div>

    <!-- Register Modal -->
    <div class="modal" id="register-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>注册</h2>
                <button class="close-btn" onclick="closeModals()">&times;</button>
            </div>
            <form id="register-form">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="register-username" required>
                </div>
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" id="register-email" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="register-password" required>
                </div>
                <div class="error-message" id="register-error"></div>
                <button type="submit" class="btn" style="width:100%;">注册</button>
            </form>
        </div>
    </div>

    <script type="module">
        // Import PharmaSpark
        import { parsePDB, parseSDF, atomsToSplats, moleculeToSplats, PharmaSparkViewer } from './src/index.ts';
        
        // State
        let viewer = null;
        let currentMolecule = null;
        let currentUser = null;
        let authToken = null;
        
        // API Base URL
        const API_BASE = 'http://localhost:8000';
        
        // DOM elements
        const container = document.getElementById('viewer-container');
        const statusEl = document.getElementById('status');
        const atomCountEl = document.getElementById('atom-count');
        const infoName = document.getElementById('info-name');
        const infoAtoms = document.getElementById('info-atoms');
        const infoResidues = document.getElementById('info-residues');
        const infoChains = document.getElementById('info-chains');
        const loading = document.getElementById('loading');
        const authButtons = document.getElementById('auth-buttons');
        const userInfo = document.getElementById('user-info');
        const userAvatar = document.getElementById('user-avatar');
        const userName = document.getElementById('user-name');
        const saveMoleculeBtn = document.getElementById('save-molecule');
        
        // Controls
        const colorMode = document.getElementById('color-mode');
        const radiusScale = document.getElementById('radius-scale');
        const opacity = document.getElementById('opacity');
        const showHydrogens = document.getElementById('show-hydrogens');
        
        // Initialize viewer
        function initViewer() {
            if (viewer) {
                viewer.dispose();
            }
            
            viewer = new PharmaSparkViewer({
                container: container,
                backgroundColor: 0x1a1a2e,
                cameraDistance: 50,
            });
            
            statusEl.textContent = '查看器已初始化';
        }
        
        // Load PDB file
        async function loadPDB(pdbId) {
            try {
                loading.classList.add('show');
                statusEl.textContent = `加载 ${pdbId}...`;
                
                // Fetch PDB file from RCSB
                const response = await fetch(`https://files.rcsb.org/download/${pdbId}.pdb`);
                const pdbText = await response.text();
                
                // Parse PDB
                const protein = parsePDB(pdbText);
                
                // Get options
                const options = {
                    colorMode: colorMode.value,
                    radiusScale: parseFloat(radiusScale.value),
                    opacity: parseFloat(opacity.value),
                    includeHydrogens: showHydrogens.value === 'true',
                };
                
                // Convert to splats
                const splatData = atomsToSplats(protein.atoms, options);
                
                // Clear and add to viewer
                viewer.clear();
                await viewer.addMolecule(pdbId, splatData);
                
                // Update info
                currentMolecule = { type: 'pdb', id: pdbId, protein, pdbText };
                updateInfo();
                
                statusEl.textContent = `已加载 ${pdbId}`;
            } catch (error) {
                console.error('加载PDB失败:', error);
                statusEl.textContent = `加载失败: ${error.message}`;
            } finally {
                loading.classList.remove('show');
            }
        }
        
        // Load SDF file
        async function loadSDF(name) {
            try {
                loading.classList.add('show');
                statusEl.textContent = `加载 ${name}...`;
                
                // Sample SDF data
                const sdfData = getSampleSDF(name);
                
                // Parse SDF
                const molecule = parseSDF(sdfData);
                
                // Get options
                const options = {
                    colorMode: colorMode.value,
                    radiusScale: parseFloat(radiusScale.value),
                    opacity: parseFloat(opacity.value),
                    includeHydrogens: showHydrogens.value === 'true',
                };
                
                // Convert to splats
                const splatData = moleculeToSplats(molecule, options);
                
                // Clear and add to viewer
                viewer.clear();
                await viewer.addMolecule(name, splatData);
                
                // Update info
                currentMolecule = { type: 'sdf', name, molecule, sdfText: sdfData };
                updateInfo();
                
                statusEl.textContent = `已加载 ${name}`;
            } catch (error) {
                console.error('加载SDF失败:', error);
                statusEl.textContent = `加载失败: ${error.message}`;
            } finally {
                loading.classList.remove('show');
            }
        }
        
        // Update info panel
        function updateInfo() {
            if (!currentMolecule) {
                infoName.textContent = '未加载分子';
                infoAtoms.textContent = '';
                infoResidues.textContent = '';
                infoChains.textContent = '';
                atomCountEl.textContent = '';
                saveMoleculeBtn.style.display = 'none';
                return;
            }
            
            if (currentMolecule.type === 'pdb') {
                const { protein } = currentMolecule;
                infoName.textContent = `蛋白质: ${currentMolecule.id.toUpperCase()}`;
                infoAtoms.textContent = `原子数: ${protein.atoms.length}`;
                infoResidues.textContent = `残基数: ${protein.chains.flatMap(c => c.residues).length}`;
                infoChains.textContent = `链数: ${protein.chains.length}`;
                atomCountEl.textContent = ` | ${protein.atoms.length} 原子`;
            } else {
                const { molecule } = currentMolecule;
                infoName.textContent = `分子: ${currentMolecule.name}`;
                infoAtoms.textContent = `原子数: ${molecule.atoms.length}`;
                infoResidues.textContent = `键数: ${molecule.bonds.length}`;
                infoChains.textContent = '';
                atomCountEl.textContent = ` | ${molecule.atoms.length} 原子`;
            }
            
            // Show save button if logged in
            if (currentUser) {
                saveMoleculeBtn.style.display = 'inline-block';
            }
        }
        
        // Save molecule to server
        async function saveMolecule() {
            if (!currentUser || !currentMolecule) {
                alert('请先登录');
                return;
            }
            
            try {
                const data = currentMolecule.type === 'pdb' ? currentMolecule.pdbText : currentMolecule.sdfText;
                const format = currentMolecule.type === 'pdb' ? 'pdb' : 'sdf';
                const name = currentMolecule.type === 'pdb' ? currentMolecule.id : currentMolecule.name;
                
                const response = await fetch(`${API_BASE}/api/molecules`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        name,
                        format,
                        data,
                        isPublic: false,
                    }),
                });
                
                if (response.ok) {
                    const result = await response.json();
                    alert('分子保存成功！');
                } else {
                    const error = await response.json();
                    alert(`保存失败: ${error.error}`);
                }
            } catch (error) {
                console.error('保存分子失败:', error);
                alert('保存失败');
            }
        }

                caffeine: `

        // Auth functions
        function showLogin() {
            document.getElementById('login-modal').style.display = 'block';
        }
        
        function showRegister() {
            document.getElementById('register-modal').style.display = 'block';
        }
        
        function closeModals() {
            document.getElementById('login-modal').style.display = 'none';
            document.getElementById('register-modal').style.display = 'none';
        }
        
        async function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errorEl = document.getElementById('login-error');
            
            try {
                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                });
                
                if (response.ok) {
                    const data = await response.json();
                    currentUser = data.user;
                    authToken = data.token;
                    localStorage.setItem('token', authToken);
                    localStorage.setItem('user', JSON.stringify(currentUser));
                    updateUI();
                    closeModals();
                } else {
                    const error = await response.json();
                    errorEl.textContent = error.error;
                }
            } catch (error) {
                errorEl.textContent = '登录失败';
            }
        }
        
        async function handleRegister(event) {
            event.preventDefault();
            
            const username = document.getElementById('register-username').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const errorEl = document.getElementById('register-error');
            
            try {
                const response = await fetch(`${API_BASE}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password }),
                });
                
                if (response.ok) {
                    const data = await response.json();
                    currentUser = data.user;
                    authToken = data.token;
                    localStorage.setItem('token', authToken);
                    localStorage.setItem('user', JSON.stringify(currentUser));
                    updateUI();
                    closeModals();
                } else {
                    const error = await response.json();
                    errorEl.textContent = error.error;
                }
            } catch (error) {
                errorEl.textContent = '注册失败';
            }
        }
        
        function logout() {
            currentUser = null;
            authToken = null;
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            updateUI();
        }
        
        function updateUI() {
            if (currentUser) {
                authButtons.style.display = 'none';
                userInfo.classList.add('show');
                userAvatar.textContent = currentUser.username.charAt(0).toUpperCase();
                userName.textContent = currentUser.username;
                if (currentMolecule) {
                    saveMoleculeBtn.style.display = 'inline-block';
                }
            } else {
                authButtons.style.display = 'flex';
                userInfo.classList.remove('show');
                saveMoleculeBtn.style.display = 'none';
            }
        }
        
        // Event listeners
        document.getElementById('load-sample').addEventListener('click', () => {
            loadPDB('1crn');
        });
        
        document.getElementById('clear').addEventListener('click', () => {
            if (viewer) {
                viewer.clear();
                currentMolecule = null;
                updateInfo();
                statusEl.textContent = '已清除';
            }
        });
        
        saveMoleculeBtn.addEventListener('click', saveMolecule);
        
        // Sample item clicks
        document.querySelectorAll('.sample-item').forEach(item => {
            item.addEventListener('click', () => {
                const pdbId = item.dataset.pdb;
                const sdfName = item.dataset.sdf;
                
                if (pdbId) {
                    loadPDB(pdbId);
                } else if (sdfName) {
                    loadSDF(sdfName);
                }
            });
        });
        
        // Control changes
        colorMode.addEventListener('change', () => {
            if (currentMolecule) {
                if (currentMolecule.type === 'pdb') {
                    loadPDB(currentMolecule.id);
                } else {
                    loadSDF(currentMolecule.name);
                }
            }
        });
        
        radiusScale.addEventListener('input', () => {
            if (currentMolecule) {
                if (currentMolecule.type === 'pdb') {
                    loadPDB(currentMolecule.id);
                } else {
                    loadSDF(currentMolecule.name);
                }
            }
        });
        
        opacity.addEventListener('input', () => {
            if (currentMolecule) {
                if (currentMolecule.type === 'pdb') {
                    loadPDB(currentMolecule.id);
                } else {
                    loadSDF(currentMolecule.name);
                }
            }
        });
        
        showHydrogens.addEventListener('change', () => {
            if (currentMolecule) {
                if (currentMolecule.type === 'pdb') {
                    loadPDB(currentMolecule.id);
                } else {
                    loadSDF(currentMolecule.name);
                }
            }
        });
        
        // Auth form submissions
        document.getElementById('login-form').addEventListener('submit', handleLogin);
        document.getElementById('register-form').addEventListener('submit', handleRegister);
        
        // Check for saved session
        const savedToken = localStorage.getItem('token');
        const savedUser = localStorage.getItem('user');
        if (savedToken && savedUser) {
            authToken = savedToken;
            currentUser = JSON.parse(savedUser);
            updateUI();
        }
        
        // Initialize
        initViewer();
    </script>
</body>
</html>
