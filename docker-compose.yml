version: '3.8'

services:
  pharmaspark:
    build: .
    container_name: pharmaspark
    ports:
      - "8000:8000"
    volumes:
      - pharmaspark-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=8000
      - DB_PATH=/app/data/pharmaspark.db
      - JWT_SECRET=${JWT_SECRET:-pharmaspark-secret-key-2024}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  pharmaspark-data:
    driver: local
